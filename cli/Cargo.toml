[package]
name = "recall"
version = "0.3.2"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/mvhenten/recall"

[[bin]]
name = "recall"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jiff = "0.2.38"
ureq = { version = "3.5.0", features = ["json"] }
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
schemars = "1"


[package.metadata.dist]
dist = true
