[package]
name = "recall"
version = "0.8.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/mvhenten/recall"

[[bin]]
name = "recall"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jiff = "0.2.38"
ureq = { version = "3.5.0", features = ["json"] }
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "io-util", "net", "time", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "sink"] }
libc = "0.2.180"
schemars = "1"


[package.metadata.dist]
dist = true
