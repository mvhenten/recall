[package]
name = "recall"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "recall"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
