name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p recall --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p recall --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: recall-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/recall

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
